name: Schedule Diagnostic (no secrets)

on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record trigger and UTC time
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
          TRIGGER_CRON: ${{ github.event.schedule }}
        run: |
          printf 'event=%s cron=%s\n' "$TRIGGER_EVENT" "$TRIGGER_CRON"
          date -u '+utc=%Y-%m-%dT%H:%M:%SZ'
