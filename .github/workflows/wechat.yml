name: WeChat Reset Monitor
run-name: ${{ inputs.scheduler_time && format('Cloudflare check {0}', inputs.scheduler_time) || 'WeChat Reset Monitor' }}
on:
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:
    inputs:
      scheduler_time:
        description: 'Cloudflare scheduled time (leave blank for manual runs)'
        type: string
        required: false
        default: ''
      send_test:
        description: '发送一条标明为测试的微信消息（消耗 1 条推送额度）'
        type: boolean
        default: false
      send_feishu_test:
        description: '发送一条标明为测试的飞书消息（不发送微信测试）'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: wechat-reset-monitor
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record trigger metadata
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
          TRIGGER_CRON: ${{ github.event.schedule }}
          SCHEDULER_TIME: ${{ inputs.scheduler_time }}
        run: |
          printf 'event=%s cron=%s\n' "$TRIGGER_EVENT" "$TRIGGER_CRON"
          printf 'cloudflare_scheduled_at=%s\n' "$SCHEDULER_TIME"
          date -u '+started_utc=%Y-%m-%dT%H:%M:%SZ'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm test
        id: tests
      - name: Check source and notify WeChat
        run: node monitor.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          SOURCE_SNAPSHOT: ${{ runner.temp }}/gpt-reset-source.json
          SEND_TEST: ${{ inputs.send_test == true && 'true' || 'false' }}
      - name: Check source and notify Feishu
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        run: node feishu.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_SIGNING_SECRET: ${{ secrets.FEISHU_SIGNING_SECRET }}
          SOURCE_SNAPSHOT: ${{ runner.temp }}/gpt-reset-source.json
          SEND_FEISHU_TEST: ${{ inputs.send_feishu_test == true && 'true' || 'false' }}
